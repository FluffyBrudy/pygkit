name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        extra: ["none", "ui", "audio", "animation", "lighting", "transitions", "inventory", "all"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest
        if [ "${{ matrix.extra }}" = "none" ]; then python -m pip install -e .; else python -m pip install -e ".[${{ matrix.extra }}]"; fi
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      if: matrix.extra == 'all'
      run: |
        pytest
    - name: Import check
      if: matrix.extra != 'all' && matrix.extra != 'none'
      run: |
        python -c "import importlib; importlib.import_module('pygkit.${{ matrix.extra }}')"
    - name: Core import check
      if: matrix.extra == 'none'
      run: |
        python -c "import sys, pygkit; loaded = {m.split('.')[1] for m in sys.modules if m.startswith('pygkit.')}; assert loaded <= {'signals', 'utils', 'protocols'}, sorted(loaded)"
