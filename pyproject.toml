[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pygkit"
version = "2.0.0"
description = "General-purpose Pygame CE runtime kit: UI widgets, audio, timers, interpolation, and more."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "pygkit contributors" }]
dependencies = [
  "pygame-ce>=2.5",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
  "Topic :: Software Development",
  "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
# One extra per subsystem. Empty for now: every subsystem is pure
# pygame-ce + stdlib. Slots are reserved for future speedups
# (lighting color math -> numpy, sprite pack -> pillow) without
# taxing core installs.
ui = []
audio = []
animation = []
lighting = []
transitions = []
inventory = []
parallax = []
all = [
  "pygkit[ui, audio, animation, lighting, transitions, inventory, parallax]",
]

[project.urls]
Homepage = "https://github.com/FluffyBrudy/pygkit"
Repository = "https://github.com/FluffyBrudy/pygkit"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["pygkit*"]
exclude = ["tests*"]
namespaces = false
